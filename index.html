<!doctype html><html lang="fr"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Wordclock — Communauté</title><style>body{background:#141414;color:#eee;font:16px system-ui;max-width:900px;margin:40px auto;padding:0 20px}main{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:16px}article{background:#222;border:1px solid #444;border-radius:14px;padding:18px} .preview{margin:12px 0;padding:24px;text-align:center;background:#111;border:9px solid;border-radius:5px;font-weight:700;line-height:1.5}a{color:#a9ebff}small{color:#bbb}</style><h1>Wordclock — Communauté</h1><p>Découvrez les premiers thèmes du catalogue.</p><p id="status" role="status">Chargement…</p><main id="themes"></main><script>
(async()=>{const status=document.getElementById('status');try{const response=await fetch('catalog.json');if(!response.ok)throw Error('HTTP '+response.status);const catalog=await response.json();if(catalog.version!==1||!Array.isArray(catalog.themes))throw Error('Format inconnu');for(const t of catalog.themes){const a=document.createElement('article'),v=document.createElement('div'),h=document.createElement('h2'),author=document.createElement('small'),d=document.createElement('p'),link=document.createElement('a');v.className='preview';v.style.color=t.front;v.style.borderColor=t.rear;v.textContent='IL EST HUIT HEURES';h.textContent=t.name;author.textContent=t.author;d.textContent=t.description;link.textContent='Télécharger le JSON';link.href=t.path;link.download=t.id+'.json';a.append(v,h,author,d,link);document.getElementById('themes').append(a)}status.textContent=catalog.themes.length+' thèmes disponibles';}catch(e){status.textContent='Catalogue indisponible : '+e.message}})();</script></html>
